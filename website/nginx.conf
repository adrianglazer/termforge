worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Keep redirects relative behind the Cloudflare HTTPS tunnel.
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

        location = / {
            try_files /index.html =404;
        }

        location = /support {
            try_files /support.html =404;
        }

        location = /privacy {
            try_files /privacy.html =404;
        }

        location = /terms {
            try_files /terms.html =404;
        }

        location = /index.html {
            return 301 /$is_args$args;
        }

        location ~ ^/(support|privacy|terms)(\.html|/)$ {
            return 301 /$1$is_args$args;
        }

        # Never serve the owner's unredacted source captures, including bind-mounted previews.
        location ^~ /assets/promo/ {
            return 404;
        }

        location / {
            try_files $uri =404;
        }
    }
}
